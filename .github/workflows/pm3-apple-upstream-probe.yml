name: PM3 Apple upstream probe

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build current RRG master
        run: ./tool/pm3_apple/build.sh --ref master
      - name: Smoke test
        run: |
          revision="$(python3 -c 'import json; print(json.load(open("artifacts/TagentraPM3Core-build.json"))["upstream_revision"])')"
          ./tool/pm3_apple/smoke_test.sh artifacts/TagentraPM3Core.xcframework "$revision"
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: TagentraPM3Core-master-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
