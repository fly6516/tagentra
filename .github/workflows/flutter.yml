name: Flutter

on:
  push:
    paths: ['lib/**', 'test/**', 'packages/**', 'pubspec.yaml', 'pubspec.lock', 'ios/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['lib/**', 'test/**', 'packages/**', 'pubspec.yaml', 'pubspec.lock', 'ios/**']

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.3
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test packages/tagentra_pm3/lib
      - run: flutter analyze
      - run: flutter test

  ios-unsigned:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.3
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
